<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="controls">
        <label for="relSelect">Style:</label>
        <select id="relSelect" onchange="updatePalette()">
            <option value="random" selected>Random (Default)</option>
            <option value="analogous">Analogous</option>
            <option value="monochromatic">Monochromatic</option>
            <option value="complementary">Complementary</option>
        </select>

        <button onclick="exportPNG()" class="action">Save as PNG</button>
        <button onclick="copyCSS()" class="action">Copy CSS</button>
    </div>
    <div class="container" id="palette">
        <div class="color-card">
            <button class="lock-btn" onclick="toggleLock(event, this)">🔓</button>
            <div class="color" onclick="copyColor(this.parentElement)"></div>
            <div class="code" onclick="copyColor(this.parentElement)">#FFFFFF</div>
        </div>
        <div class="color-card">
            <button class="lock-btn" onclick="toggleLock(event, this)">🔓</button>
            <div class="color" onclick="copyColor(this.parentElement)"></div>
            <div class="code" onclick="copyColor(this.parentElement)">#FFFFFF</div>
        </div>
        <div class="color-card">
            <button class="lock-btn" onclick="toggleLock(event, this)">🔓</button>
            <div class="color" onclick="copyColor(this.parentElement)"></div>
            <div class="code" onclick="copyColor(this.parentElement)">#FFFFFF</div>
        </div>
        <div class="color-card">
            <button class="lock-btn" onclick="toggleLock(event, this)">🔓</button>
            <div class="color" onclick="copyColor(this.parentElement)"></div>
            <div class="code" onclick="copyColor(this.parentElement)">#FFFFFF</div>
        </div>
        <div class="color-card">
            <button class="lock-btn" onclick="toggleLock(event, this)">🔓</button>
            <div class="color" onclick="copyColor(this.parentElement)"></div>
            <div class="code" onclick="copyColor(this.parentElement)">#FFFFFF</div>
        </div>
    </div>

    <div class="hint">Press space to generate a new palette</div>
    <div class="toast" id="toast">Code copied :)</div>
    <script src="script.js"></script>
</body>
</html>
