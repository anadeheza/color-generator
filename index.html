<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="controls">
        <label for="relSelect">Style:</label>
        <select id="relSelect" onchange="updatePalette()">
            <option value="random" selected>Random (Default)</option>
            <option value="analogous">Analogous</option>
            <option value="monochromatic">Monochromatic</option>
            <option value="complementary">Complementary</option>
        </select>

        <label for="codeSel" class="formats">Code:</label>
        <select id="codeSel" onchange="changeColorCode()">
            <option value="hex" selected>HEX</option>
            <option value="rgb">RGB</option>
            <option value="hsl">HSL</option>
        </select>

        <button onclick="saveToFav()" class="action favorite">♡</button>
        <button onclick="openCloseFavs()" class="action fav-list-btn">Favourites</button>
        </div>
    <div class="container" id="palette">
        <div class="color-card">
            <button class="lock-btn" onclick="toggleLock(event, this)">🔓</button>
            <div class="color" onclick="copyColor(this.parentElement)"></div>
            <div class="code" onclick="copyColor(this.parentElement)">#FFFFFF</div>
        </div>
        <div class="color-card">
            <button class="lock-btn" onclick="toggleLock(event, this)">🔓</button>
            <div class="color" onclick="copyColor(this.parentElement)"></div>
            <div class="code" onclick="copyColor(this.parentElement)">#FFFFFF</div>
        </div>
        <div class="color-card">
            <button class="lock-btn" onclick="toggleLock(event, this)">🔓</button>
            <div class="color" onclick="copyColor(this.parentElement)"></div>
            <div class="code" onclick="copyColor(this.parentElement)">#FFFFFF</div>
        </div>
        <div class="color-card">
            <button class="lock-btn" onclick="toggleLock(event, this)">🔓</button>
            <div class="color" onclick="copyColor(this.parentElement)"></div>
            <div class="code" onclick="copyColor(this.parentElement)">#FFFFFF</div>
        </div>
        <div class="color-card">
            <button class="lock-btn" onclick="toggleLock(event, this)">🔓</button>
            <div class="color" onclick="copyColor(this.parentElement)"></div>
            <div class="code" onclick="copyColor(this.parentElement)">#FFFFFF</div>
        </div>
    </div>

    <div class="hint">Press space to generate a new palette</div>

    <div class="exports">
        <button onclick="exportPNG()" class="action">Save as PNG</button>
        <button onclick="copyCSS()" class="action">Copy CSS</button>
    </div>


    <div class="overlay" id="overlay" onclick="openFavs()"></div>
    <div class="fav-sidebar" id="fav-sidebar">
        <div class="sidebar-header">
            <h2>Favourite Palettes</h2>
            <div class="close-btn" onclick="openCloseFavs()">X</div>
        </div>
        <div class="fav-list" id="favList"></div>
    </div>

    <div class="toast" id="toast">Code copied :)</div>
    <script src="script.js"></script>
</body>
</html>
